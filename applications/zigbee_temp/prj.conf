CONFIG_NCS_SAMPLES_DEFAULTS=y

# Disable CoffeeCaller subsystems (not needed; cc_broadcast defaults to OpenThread
# on hardware, which conflicts with the Zigbee IEEE 802.15.4 radio)
CONFIG_CC_BROADCAST_SUBSYS=n
CONFIG_CC_COFFEECALL_SUBSYS=n
CONFIG_CC_TEMPERATURE_SUBSYS=n
CONFIG_TRANSPORT_LOCALQUEUE=y

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Zigbee coordinator
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_COORDINATOR=y
CONFIG_DK_LIBRARY=y

# BLE peripheral (ESS) — MPSL handles radio time-sharing automatically
# BLE uses ECB peripheral directly; disable the standalone crypto driver
CONFIG_CRYPTO=n
CONFIG_CRYPTO_NRF_ECB=n
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CoffeeCaller"
CONFIG_BT_DEVICE_APPEARANCE=1344
CONFIG_BT_MAX_CONN=4

# Disable unused IP networking (Zigbee uses its own L2)
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y
