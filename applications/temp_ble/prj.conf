# Disable CoffeeCaller subsystems (not needed for this standalone app)
CONFIG_CC_BROADCAST_SUBSYS=n
CONFIG_CC_COFFEECALL_SUBSYS=n
CONFIG_CC_TEMPERATURE_SUBSYS=n
# cc_broadcast transport choice has no depends on CC_BROADCAST_SUBSYS,
# so default TRANSPORT_OPENTHREAD would trigger on hw boards; force localqueue.
CONFIG_TRANSPORT_LOCALQUEUE=y

# BLE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CoffeeCaller"
CONFIG_BT_DEVICE_APPEARANCE=1344
CONFIG_BT_MAX_CONN=4

# SHT-40 sensor
CONFIG_SENSOR=y
CONFIG_SHT4X=y
CONFIG_I2C=y

# USB CDC-ACM (board defconfig already enables USB_DEVICE_STACK)
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# Stack
CONFIG_MAIN_STACK_SIZE=2048
