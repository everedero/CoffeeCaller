# Standalone manifest for CoffeeCaller using NCS v2.8.0.
# NCS v2.8.0 is the last release that includes Zigbee (ZBOSS in nrfxlib).
#
# Usage (fresh workspace):
#   west init -m https://github.com/everedero/CoffeeCaller
#   west update
#
# Usage (existing NCS v2.8.0 workspace at /home/eve/ncs/v2.8.0/):
#   cd /home/eve/ncs/v2.8.0
#   west build -b coffeecaller_nrf52/nrf52840 \
#     /home/eve/ncs/CoffeeCaller/applications/zigbee_temp \
#     -p always -- -DZEPHYR_EXTRA_MODULES=/home/eve/ncs/CoffeeCaller

manifest:
  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect

  projects:
    - name: sdk-nrf
      remote: nrfconnect
      revision: v2.8.0
      path: nrf
      import: true   # pulls zephyr, nrfxlib (ZBOSS), mcuboot, openthread, etc.

  self:
    path: CoffeeCaller
