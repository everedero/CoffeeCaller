adapter driver ftdi
transport select swd

ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# Safe startup state
ftdi layout_init 0x0000 0x001b

# SWCLK = ADBUS0 (TCK)
ftdi layout_signal SWCLK -data 0x0001

# SWDIO:
#   ADBUS1 (TDI) drives the line
#   ADBUS2 (TDO) reads the line
ftdi layout_signal SWDIO -data 0x0002 -input 0x0004

# Required by OpenOCD, but not physically connected
ftdi layout_signal SWD_EN -ndata 0

# Optional reset on ADBUS4
ftdi layout_signal nSRST -data 0x0010

adapter speed 1000

source [find target/nrf52.cfg]
